name: DeltaProof offline quality checks
on:
  push:
  pull_request:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install pytest
      - run: python -m compileall -q contracts tests
      - run: python -m pytest -q tests/test_contract.py tests/test_parity.py
      - run: cd frontend && npm ci && npm run check
  # GenVM lint + live mode intentionally belong to a gated environment with real runner/RPC.
